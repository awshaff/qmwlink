experiment: e5_classical_throughput
environment: {T_env_k: 300.0}
p_t_w: 1.0e-6        # [A] equal TX power for both receivers (placeholder)
n_s: [1.0e4]         # [A] photons/mode for the bits-per-mode panel
bands_ghz: [5, 30, 100, 300]
f_ghz: {start: 5, stop: 300, num: 8, scale: log}
distance_m: {start: 10, stop: 1000, num: 8, scale: log}
small_scale: {K: [0, 10, 100]}
large_scale:
  model: loggamma
  gamma_abs_per_m: {5: 1.44e-6, 30: 0.0, 100: 0.0, 300: 0.0}
  gamma_abs_source:
    5: "Gonzalez-Raya et al., PRApplied 18, 044002 (2022)"
    30: "[A] placeholder, no absorption (ITU-R P.676 value to be supplied)"
    100: "[A] placeholder, no absorption (ITU-R P.676 value to be supplied)"
    300: "[A] placeholder, no absorption (ITU-R P.676 value to be supplied)"
  stochastic: {mean: 1.0e-3, std: 5.0e-4}   # [A] placeholder (Q-7)
link_budget: {coupling_model: goubau, A_t_m2: 2.0, A_r_m2: 2.0, G_enh: 1.0, sensitivity_models: [goubau]}
receivers:
  - {label: "Holevo", kind: holevo}
  - {label: "ideal het", kind: het}
  - {label: "ideal hom", kind: hom}
# Per-band inputs for the rho map. ALL [A] illustrative placeholders, not literature values (Q-7).
rar_field_convention: rms
rar_sideband: dsb
rar_bands:
  - {f_ghz: 5,   bandwidth_hz: 1.0e6, value: 2.0e-7, source: "[A] placeholder"}
  - {f_ghz: 30,  bandwidth_hz: 1.0e6, value: 3.0e-7, source: "[A] placeholder"}
  - {f_ghz: 100, bandwidth_hz: 1.0e6, value: 5.0e-7, source: "[A] placeholder"}
  - {f_ghz: 300, bandwidth_hz: 1.0e6, value: 1.0e-6, source: "[A] placeholder"}
lna_tn_convention: rj
lna_sideband: ssb
lna_bands:
  - {f_ghz: 5,   bandwidth_hz: 1.0e8, value: 50.0,   source: "[A] placeholder"}
  - {f_ghz: 30,  bandwidth_hz: 1.0e8, value: 100.0,  source: "[A] placeholder"}
  - {f_ghz: 100, bandwidth_hz: 1.0e8, value: 300.0,  source: "[A] placeholder"}
  - {f_ghz: 300, bandwidth_hz: 1.0e8, value: 1000.0, source: "[A] placeholder"}
