experiment: e2_law_comparison
environment: {T_env_k: 300.0}
band_ghz: 30
distance_m: 50               # inside the 30 GHz geometric reach (86.6 m at 2 m^2, TSD §16.6)
K: 10
n_s: 1.0e4                   # sweep value (bit/mode), as in E8; not a measurement
# Psi_0 = gamma_abs d and mu_G = mean d are taken from this block; its std only marks the sourced
# sigma_Psi/Psi_bar in meta.json. The sweep itself is law_comparison.sigma_ratio (TSD §6.2).
large_scale:
  model: loggamma
  psi0_from_absorption: true
  # Deterministic part Psi0 = gamma_abs * d: O2 specific attenuation, ITU-R P.676-12 Annex 1, 1013.25 hPa, 300 K (TSD §16.1).
  gamma_abs_per_m: {5: 1.524e-6, 30: 4.394e-6, 100: 6.641e-6, 300: 5.088e-6}
  gamma_abs_source: "ITU-R P.676-12 Annex 1 (via itur 0.4.0), O2 only, 1013.25 hPa, 300 K"
  # Stochastic part G (water vapour + rain), KHU Seoul, annual statistics, fully correlated path (TSD §6.2, §16.2).
  # mu_G = mean * d, sigma_G = std * d, so k = mean^2/std^2 is distance-independent.
  stochastic_per_m:
    5:   {mean: 4.160e-7, std: 9.028e-7}
    30:  {mean: 2.839e-5, std: 6.760e-5}
    100: {mean: 1.509e-4, std: 2.049e-4}
    300: {mean: 1.523e-3, std: 1.101e-3}
  stochastic_source: "ITU-R P.836 + P.676-12 (vapour), P.837-7 + P.838-3 (rain), annual, KHU Seoul 37.597N 127.052E"
link_budget:
  coupling_model: goubau
  A_t_m2: 2.0      # [A] design choice (TSD §16.6): about a 2.0 m dish at e_a = 0.65
  A_r_m2: 2.0      # [A] antenna-fed receiver. Geometric reach before absorption: 12.5 / 87 / 328 / 1144 m
  G_enh: 1.0       # receive side only; keep 1 when A_r is an antenna aperture (§6.5)
  sensitivity_models: [goubau]
source_state: {type: tmsv, r: 1.0}
law_comparison:
  match: psi_moments         # all laws share mean and variance of Psi and the same Psi_0 [A]
  eta_gt1: clip              # V0 log-normal: evaluate at min(eta, 1), physical=False, mass reported
  sigma_ratio: [0.05, 0.1, 0.2, 0.35, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0]
rar: {source: literature_rar, literature: configs/literature_rar.yaml, require_b_hz: true, sideband: from_entry}
pdf_sigma_ratio: 1.0         # sigma_Psi = Psi_bar: V0 mass above 1 is Phi(-1) = 0.158655
pdf_eta: {start: 0.99, stop: 1.004, num: 281, scale: lin}
